name: Poll jobs

on:
  schedule:
    # كل ساعة. مواقع الوظايف مبتتحدثش أسرع من كده، والأسرع بيحرق دقايق ببلاش.
    # ملحوظة: GitHub ممكن يأخّر التشغيل 5–15 دقيقة وقت الضغط.
    - cron: "7 * * * *"
  workflow_dispatch:          # زرار تشغيل يدوي من تاب Actions
  push:
    paths:
      - "companies.yaml"      # عدّلت السجل؟ اتأكد منه فورًا
      - "src/**"
      - ".github/workflows/poll-jobs.yml"

# تشغيلتين في نفس الوقت = شغل مكرر واحتمال تصادم عند الحفظ.
# الجديدة تستنى القديمة تخلص، مش بتلغيها — الشغل نفسه مهم.
concurrency:
  group: poll-jobs
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # الاختبارات بتشتغل قبل السحب. لو مصدر غيّر شكل الـ API،
        # نعرف من هنا بدل ما نكتشف بعد أسبوع إن الداتا ناقصة.
        run: pytest -q

      - name: Poll job boards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m src.main

      - name: Score new jobs
        # الحصة المجانية بتخلص، فالتقييم بيمشي على دفعات. الوظايف
        # المتبقية بتفضل في الطابور — الجدول نفسه هو الطابور.
        # continue-on-error عشان فشل التقييم مايخفيش نجاح السحب.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.score

      - name: Notify on Telegram
        # آخر خطوة عن قصد: الإرسال هو الجزء الوحيد اللي بيوصله، فلو
        # وقع لازم يبان لوحده مش مدفون جوّا فشل سحب أو تقييم.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.notify
