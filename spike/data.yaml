cv:
  title: "AI & Automation Engineer"
  years_experience: 3
  location: "مصر — متاح ريموت ومستعد للانتقال للخليج"
  summary: >
    مهندس أتمتة وذكاء اصطناعي. خلفية في تحليل البيانات، بيبني أنظمة داخلية
    تربط الـ LLMs بعمليات الشركات الحقيقية.
  skills:
    languages:   [Python, SQL, JavaScript, "Google Apps Script"]
    ai:          ["OpenAI API", Ollama, "local LLMs", RAG, "hybrid retrieval", Whisper, "prompt engineering"]
    automation:  [n8n, "REST APIs", Webhooks, "Zapier"]
    data:        [Supabase, PostgreSQL, "ETL", "data modeling", "Power BI", "Excel"]
    other:       [Git, Docker, "CRM systems"]
  experience:
    - "بناء أنظمة أتمتة داخلية بتربط CRMs وقواعد بيانات وAPIs خارجية"
    - "بناء Meeting Copilot: Whisper محلي + Ollama + استرجاع هجين على تخزين RAG"
    - "تصميم ونشر تكاملات LLM في سير عمل شغل حقيقي"
    - "خطوط ETL وpipelines بيانات على Supabase/Postgres"
    - "لوحات تحليلية وتقارير لأصحاب القرار"
  no_experience_with:
    - "Swift / iOS / تطوير موبايل"
    - "Spark / Hadoop / big data موزّع"
    - "Kubernetes"

jobs:
  - id: J1
    expect: "عالي"
    title: "AI Automation Engineer"
    company: "Nexa Labs"
    location: "Remote"
    description: |
      We are looking for an AI Automation Engineer to design and ship internal
      systems that connect large language models to business operations.

      Responsibilities:
      - Build automation workflows integrating LLM APIs with internal tools
      - Design and maintain REST API integrations and webhooks
      - Work with Postgres/Supabase for application data
      - Prototype retrieval-augmented generation features
      - Partner with operations teams to identify automation opportunities

      Requirements:
      - 2+ years building software with Python
      - Hands-on experience with LLM APIs (OpenAI, Anthropic, or similar)
      - Comfortable with SQL and relational databases
      - Experience with workflow automation tools (n8n, Zapier, Make)
      - Good written English

      Nice to have: experience with local models (Ollama, llama.cpp), vector search.

