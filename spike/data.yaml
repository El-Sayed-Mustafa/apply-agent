      Senior iOS Engineer to own our flagship consumer application.

      Requirements:
      - 8+ years of professional software engineering
      - 5+ years shipping production iOS apps in Swift
      - Deep knowledge of SwiftUI, UIKit, Combine
      - Experience with Core Data, offline-first architecture
      - Published apps on the App Store
      - Experience leading code review and mentoring junior engineers

