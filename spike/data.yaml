    location: "Riyadh, Saudi Arabia — Hybrid"
    description: |
      Data Engineer to build and maintain our analytics data platform.

      Requirements:
      - 3+ years in data engineering or a closely related role
      - Strong SQL and Python
      - Experience building ETL/ELT pipelines
      - Experience with Apache Spark and Airflow (or similar orchestrators)
      - Familiarity with cloud data warehouses (BigQuery, Snowflake, Redshift)
      - Understanding of dimensional modeling

      Responsibilities:
      - Build batch and streaming pipelines feeding the analytics warehouse
      - Own data quality checks and pipeline observability
      - Support analysts and BI developers with modeled datasets
      - Collaborate with the emerging ML team on feature pipelines

      Nice to have: exposure to ML workflows, dbt, Arabic language skills.
