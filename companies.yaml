# سجل الشركات — ده الملف الوحيد اللي هتعدّله بشكل منتظم
#
# ازاي تجيب الـ token:
#   1. افتح صفحة التوظيف بتاعة الشركة
#   2. F12 → تاب Network → اعمل refresh
#   3. دوّر على نداء فيه greenhouse / lever / ashby / recruitee / workable
#   4. الـ token هو الجزء اللي بعد اسم النظام في اللينك
#
# أمثلة على شكل اللينك:
#   greenhouse : https://boards-api.greenhouse.io/v1/boards/<token>/jobs?content=true
#   lever      : https://api.lever.co/v0/postings/<token>?mode=json
#   ashby      : https://api.ashbyhq.com/posting-api/job-board/<token>
#   recruitee  : https://<token>.recruitee.com/api/offers/
#   workable   : https://apply.workable.com/api/v1/widget/accounts/<token>?details=true
#
# tier: 1 = الشركات المستهدفة، 2 = مهتم، 3 = مراقبة بعيدة
# بعد ما تضيف أي شركة، شغّل:  python -m src.main --verify

companies:

