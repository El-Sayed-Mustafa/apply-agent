<!--
  قالب السيرة — صفحة واحدة، مكثّفة.

  الخط متضمّن كـ base64 جوّه الملف، فالـ PDF بيطلع نفس الشكل بالظبط
  على أي جهاز — على جهازك وعلى سيرفر GitHub Actions.

  القياسات كلها بالمليمتر والنقطة عشان الطباعة، مش بالبكسل.
-->
<meta charset="utf-8">
<style>
@font-face { font-family:'SS'; font-weight:400; font-style:normal;
             src:url(data:font/ttf;base64,__REG__) format('truetype'); }
@font-face { font-family:'SS'; font-weight:600; font-style:normal;
             src:url(data:font/ttf;base64,__SEMI__) format('truetype'); }
@font-face { font-family:'SS'; font-weight:700; font-style:normal;
             src:url(data:font/ttf;base64,__BOLD__) format('truetype'); }
@font-face { font-family:'SS'; font-weight:400; font-style:italic;
             src:url(data:font/ttf;base64,__ITAL__) format('truetype'); }

@page { size: A4; margin: 9mm 10mm; }

:root{
  --ink:#111;
  --muted:#5b5b5b;
  --rule:#111;
  --fs:8.7pt;          /* الأساس — مضبوط عشان الصفحة الواحدة */
  --lh:1.30;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:'SS','Source Sans 3','Segoe UI',sans-serif;
  font-size:var(--fs);
  line-height:var(--lh);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* ── الترويسة ─────────────────────────────────────────────── */
header{ text-align:center; margin-bottom:3.4mm; }
h1{ font-size:19pt; font-weight:700; letter-spacing:-.2pt; line-height:1.05; }
.role{ font-size:10.6pt; color:var(--muted); margin-top:.6mm; }
.meta{ font-size:8.2pt; color:var(--muted); margin-top:1.5mm; }
.meta a{ color:var(--muted); text-decoration:none; }
.meta a:hover{ text-decoration:underline; }
.meta .sep{ padding:0 2.2mm; opacity:.45; }

/* ── الأقسام ──────────────────────────────────────────────── */
section{ margin-top:2.9mm; }
h2{
  font-size:8.4pt; font-weight:700; text-transform:uppercase;
  letter-spacing:.75pt; padding-bottom:.7mm; margin-bottom:1.5mm;
  border-bottom:.9pt solid var(--rule);
}

.summary{ text-align:justify; }

/* ── سطر الوظيفة/المشروع ──────────────────────────────────── */
.entry{ display:flex; justify-content:space-between; align-items:baseline;
        gap:4mm; margin-top:1.9mm; }
.entry:first-of-type{ margin-top:0; }
.entry .what{ font-weight:700; }
.entry .what a{ color:var(--ink); text-decoration:none; }
.entry .where{ font-weight:400; color:var(--ink); }
.entry .when{ font-size:8.1pt; color:var(--muted); white-space:nowrap; }
.stack{ font-style:italic; color:var(--muted); font-size:8.2pt;
        margin-top:.15mm; }

/* ── النقط ────────────────────────────────────────────────── */
ul{ list-style:none; margin-top:.5mm; }
li{ position:relative; padding-left:3.1mm; margin-top:.55mm; }
li::before{ content:'▪'; position:absolute; left:0; top:-.15mm;
            color:var(--ink); font-size:7.4pt; }
li b, li strong{ font-weight:600; }

/* ── المهارات — عمودين ────────────────────────────────────── */
.skills{ display:grid; grid-template-columns:1fr 1fr;
         column-gap:6mm; row-gap:.9mm; }
.skills div{ display:flex; gap:1.6mm; }
.skills dt{ font-weight:700; white-space:nowrap; }
.skills dd{ color:var(--ink); }

/* ── الذيل: تعليم وشهادات ولغات ───────────────────────────── */
.tail{ display:grid; grid-template-columns:1.35fr 1fr; column-gap:6mm; }
.tail h2{ margin-bottom:1.3mm; }
.certs li{ margin-top:.4mm; }
.certs a{ color:var(--ink); text-decoration:none; }
.certs .by{ color:var(--muted); }
.langs{ color:var(--ink); }
</style>

<header>
  <h1>__NAME__</h1>
  <div class="role">__ROLE__</div>
  <div class="meta">__META__</div>
</header>

__BODY__
