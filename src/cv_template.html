<!--
  قالب السيرة — صفحة واحدة، عمود واحد.

  ⚠️ قاعدة مقدّسة: **مفيش أعمدة جانبية.**

  مرّينا على شكلين وقعوا في نفس الفخ عند استخراج النص:
    · grid من عمودين للمهارات والتعليم → الاستخراج بيلحم اليمين
      بالشمال سطر بسطر:
          "Python, FastAPI, REST APIs, Authentication, Automation"
           └── عمود شمال ──────────────────┘ └─ عمود يمين ─┘
    · لابل في عمود جنبه → اللابل نفسه بيتلف ("Automation &" /
      "Scraping") فيتلحم بالقيم.

  الـ ATS بيقرا الخليط ده كأنه جملة واحدة. عمود واحد من فوق لتحت
  بيمنع ده تمامًا، وترتيب الـ DOM بيبقى هو نفسه ترتيب القراءة.

  الخط متضمّن base64، فالـ PDF بيطلع نفس الشكل على أي جهاز.
-->
<meta charset="utf-8">
<style>
@font-face { font-family:'SS'; font-weight:400; font-style:normal;
             src:url(data:font/ttf;base64,__REG__) format('truetype'); }
@font-face { font-family:'SS'; font-weight:600; font-style:normal;
             src:url(data:font/ttf;base64,__SEMI__) format('truetype'); }
@font-face { font-family:'SS'; font-weight:700; font-style:normal;
             src:url(data:font/ttf;base64,__BOLD__) format('truetype'); }
@font-face { font-family:'SS'; font-weight:400; font-style:italic;
             src:url(data:font/ttf;base64,__ITAL__) format('truetype'); }

@page { size:A4; margin:10mm 11mm; }

:root{
  --ink:#111;
  --soft:#3a3a3a;
  --muted:#6a6a6a;
  --fs:9pt;
  --lh:1.34;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:'SS','Source Sans 3','Segoe UI',sans-serif;
  font-size:var(--fs); line-height:var(--lh); color:var(--soft);
  -webkit-font-smoothing:antialiased;
  /* Chromium بيوزّع الأسطر عشان مايبقاش فيه سطر أخير بكلمة واحدة.
     السطر اليتيم ده أوضح عيب بصري في السيرة، وبيحصل في أي فقرة
     طولها شوية فوق السطر. */
  text-wrap:pretty;
  orphans:2; widows:2;
}

/* ── الترويسة ─────────────────────────────────────────────── */
header{ text-align:center; margin-bottom:4.2mm; }
h1{ font-size:21pt; font-weight:700; color:var(--ink);
    letter-spacing:-.35pt; line-height:1.02; }
.role{ font-size:10.4pt; color:var(--muted); margin-top:.9mm;
       letter-spacing:.15pt; }
.meta{ font-size:8.3pt; color:var(--muted); margin-top:2mm; }
.meta a{ color:var(--muted); text-decoration:none; }
.meta .sep{ padding:0 1.9mm; opacity:.4; }
/* الأيقونة SVG مرسومة، مش حرف — يعني مبتظهرش خالص في استخراج
   النص، فالـ ATS بيقرا الإيميل نضيف من غير رموز قبله */
.ic{ width:2.6mm; height:2.6mm; vertical-align:-.4mm;
     margin-right:1mm; stroke:currentColor; stroke-width:1.6;
     fill:none; stroke-linecap:round; stroke-linejoin:round;
     opacity:.8; }
.ic.fill{ fill:currentColor; stroke:none; }

/* ── الأقسام ──────────────────────────────────────────────── */
section{ margin-top:3.6mm; }
h2{
  font-size:8.4pt; font-weight:700; color:var(--ink);
  text-transform:uppercase;
  /* تباعد صغير عن قصد: 1.1pt كان بيخلي بعض المستخرِجات تقرا
     "EXPERI ENCE" — والـ ATS ساعتها مش بيتعرّف على القسم أصلاً */
  letter-spacing:.5px;
  padding-bottom:.8mm; margin-bottom:2mm;
  border-bottom:.8pt solid #111;
}

.summary{ color:var(--soft); }

/* ── الوظيفة/المشروع: كل واحدة كتلة واحدة ─────────────────── */
/* العنوان والنقط جوّه نفس الـ article — مايتفصلوش عند الطباعة
   ولا في ترتيب النص جوّه الملف */
.block{ break-inside:avoid; page-break-inside:avoid; margin-top:2.6mm; }
.block:first-of-type{ margin-top:0; }

.head{ display:flex; justify-content:space-between; align-items:baseline;
       gap:5mm; }
.what{ font-size:9.6pt; font-weight:700; color:var(--ink); }
.what a{ color:var(--ink); text-decoration:none; }
.where{ font-weight:400; color:var(--ink); }
.when{ font-size:8.2pt; color:var(--muted); white-space:nowrap; }
.stack{ font-style:italic; color:var(--muted); font-size:8.3pt;
        margin-top:.3mm; }

/* ── النقط ────────────────────────────────────────────────── */
/* قايمة عادية بعلامة حقيقية — من غير position:absolute.
   الـ ::before المطلق كان بيخلي Chromium يرسم القايمة كلها في
   طبقة منفصلة، فالنقط بتتأخر في ترتيب النص جوّه الـ PDF
   وبتتقري بعد كل العناوين. */
ul{ list-style:disc outside; margin-top:1mm; padding-left:3.6mm; }
li{ margin-top:1mm; }
li::marker{ color:#9a9a9a; font-size:7pt; }

/* الأرقام هي أول حاجة العين بتقف عليها — وزن أعرض ولون أغمق */
b{ font-weight:600; color:var(--ink); }

/* ── المهارات — فقرة لكل مجموعة، اللابل أول الكلام ────────── */
/* الأسطر الملفوفة بتزيح لجوّه عشان اللابل يفضل باين على الحافة */
.skills{ margin-top:.4mm; }
.srow{ margin-top:1.3mm; padding-left:5mm; text-indent:-5mm; }
.srow:first-child{ margin-top:0; }
.slabel{ font-weight:700; color:var(--ink); }

/* ── الذيل — برضه عمود واحد ───────────────────────────────── */
.inline{ margin-top:.4mm; }
.inline .sep{ padding:0 1.6mm; opacity:.4; color:var(--muted); }
.inline a{ color:var(--soft); text-decoration:none; }
.by{ color:var(--muted); }

/* قايمة مضغوطة للشهادات واللغات: كل عنصر سطر لوحده.
   الفاصل النقطي كان بيختفي في الاستخراج فالعناصر تلتزق —
   "DeepLearning.AI Advanced SQL". السطر المستقل مبيلتبسش. */
ul.tight{ margin-top:.6mm; }
ul.tight li{ margin-top:.35mm; }
ul.tight a{ color:var(--soft); text-decoration:none; }
</style>

<header>
  <h1>__NAME__</h1>
  <div class="role">__ROLE__</div>
  <div class="meta">__META__</div>
</header>

__BODY__
