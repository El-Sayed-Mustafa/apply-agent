<!--
  قالب السيرة — نسخة من تصميم FlowCV بتاعك (Resume 2026-11-16).

  اتقاس على الـ PDF الأصلي: A4، هوامش ~14مم، Source Sans 3، عناوين أقسام
  بخط عريض وتحتها خط أسود بعرض الصفحة، المهارات في عمودين، والمشاريع
  بأيقونة لينك جنب الاسم. صفحتين بحد أقصى.

  عن المهارات في عمودين: الاستخراج النصي بيقرا الصف بالعرض، فبيلحم
  مجموعة الشمال بمجموعة اليمين في نفس السطر — وده موجود في سيرة FlowCV
  الأصلية نفسها. الكلمات المفتاحية بتفضل موجودة كلها، فالـ ATS بيلاقيها؛
  اللي بيتلخبط ترتيب العرض بس. اخترنا الشكل بتاعك عن قصد.

  الخط متضمّن base64، فالـ PDF بيطلع نفس الشكل على أي جهاز.
-->
<meta charset="utf-8">
<style>
@font-face { font-family:'SS'; font-weight:400; font-style:normal;
             src:url(data:font/ttf;base64,__REG__) format('truetype'); }
@font-face { font-family:'SS'; font-weight:600; font-style:normal;
             src:url(data:font/ttf;base64,__SEMI__) format('truetype'); }
@font-face { font-family:'SS'; font-weight:700; font-style:normal;
             src:url(data:font/ttf;base64,__BOLD__) format('truetype'); }
@font-face { font-family:'SS'; font-weight:400; font-style:italic;
             src:url(data:font/ttf;base64,__ITAL__) format('truetype'); }

@page { size:A4; margin:12.5mm 13.8mm 12mm 13.8mm; }

:root{
  --ink:#141414;
  --fs:10.8pt;
  --lh:1.38;
}

*{ margin:0; padding:0; box-sizing:border-box; }

body{
  font-family:'SS','Source Sans 3','Segoe UI',sans-serif;
  font-size:var(--fs); line-height:var(--lh); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  orphans:2; widows:2;
}
a{ color:inherit; text-decoration:none; }

/* ── الترويسة ─────────────────────────────────────────────── */
header{ text-align:center; margin-bottom:4.6mm; }
h1{ font-size:18.5pt; font-weight:700; line-height:1.1; }
.role{ font-size:11.2pt; margin-top:1.4mm; }
.meta{ font-size:10.4pt; margin-top:2.6mm; line-height:1.85; }
.meta .item{ white-space:nowrap; margin:0 2.2mm; }
.ic{ width:3.2mm; height:3.2mm; vertical-align:-.55mm; margin-right:1.4mm;
     fill:currentColor; stroke:none; }
.ic.line{ fill:none; stroke:currentColor; stroke-width:1.7;
          stroke-linecap:round; stroke-linejoin:round; }

/* ── الأقسام ──────────────────────────────────────────────── */
section{ margin-top:4.4mm; }
h2{
  font-size:11.6pt; font-weight:700; letter-spacing:.35pt;
  padding:0 0 .9mm 0; margin-bottom:2.2mm;
  border-bottom:1.6pt solid var(--ink);
  break-after:avoid;
}
.summary{ text-align:left; }

.block{ margin-top:2.4mm; break-inside:avoid; }
.block:first-of-type{ margin-top:0; }
.head{ display:flex; justify-content:space-between; align-items:baseline;
       gap:4mm; }
.what{ font-weight:700; }
.where{ font-style:italic; }
.when{ white-space:nowrap; }
.when .bar{ padding:0 1.6mm; }
.sub{ font-style:italic; }
/* زي FlowCV: لو "الجهة | الأدوات" مش هتكفي في السطر، بتنزل كلها
   سطر جديد بدل ما تتقطع في النص */
.head + .sub, .inl .sub{ display:inline-block; }

ul{ list-style:none; }
/* النقطة inline بمسافة معلّقة، مش position:absolute — المطلق بيترسم في
   طبقة لوحده فبيتأخر في ترتيب النص جوّه الـ PDF */
li{ padding-left:4.2mm; text-indent:-4.2mm; }
li::before{ content:"•"; display:inline-block; width:4.2mm;
            text-indent:0; padding-left:.6mm; font-weight:700; }
b{ font-weight:600; }

/* أيقونة اللينك الصغيرة جنب اسم المشروع والشهادة */
.ext{ width:2.6mm; height:2.6mm; vertical-align:-.1mm; margin:0 0 0 1.2mm;
      fill:none; stroke:#555; stroke-width:1.5; stroke-linecap:round;
      stroke-linejoin:round; }

/* ── المهارات: عمودين ─────────────────────────────────────── */
.skills{ display:grid; grid-template-columns:1fr 1fr; column-gap:9mm;
         row-gap:3.2mm; }
.skills .group{ break-inside:avoid; }

/* ── الشهادات واللغات ─────────────────────────────────────── */
.cert{ margin-top:1.9mm; }
.cert:first-child{ margin-top:0; }
.langs{ display:grid; grid-template-columns:repeat(3, 1fr); }
.langs .what{ display:block; }
</style>

<header>
  <h1>__NAME__</h1>
  <div class="role">__ROLE__</div>
  <div class="meta">__META__</div>
</header>
__BODY__
